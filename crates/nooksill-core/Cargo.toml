[package]
name = "nooksill-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "NookSill 的纯逻辑层：配置、条目模型、INI 编解码、布局数学"

# 依赖只允许**与宿主无关**的 crate：本 crate 必须能在任何宿主上编译与测试
# （包括 CI 的 Linux runner），这样布局/配置这类纯数学逻辑才可能用最快的
# 反馈回路验证。任何 Win32 依赖都属于越界。
# thiserror 是跨平台 proc-macro，编译期展开、无运行时产物，不破坏该约束。
[dependencies]
thiserror.workspace = true

[lints.rust]
unsafe_code = "forbid"
